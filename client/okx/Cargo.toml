[package]
name = "manifest-okx"
version = "0.3.0"
edition = "2021"
repository = "https://github.com/Bonasa-Tech/manifest"
authors = ["Britt Cyr <britt@cks.systems>"]
description = "OKX AMM interface for Manifest exchange"
license-file = "LICENSE"

[lints]
workspace = true

[features]
test = []
test-sbf = []

[dependencies]
anyhow = { workspace = true }
manifest-dex = { path = "../../programs/manifest" }
hypertree = { path = "../../lib" }
solana-program = { workspace = true }
spl-token = { workspace = true }
spl-token-2022 = { workspace = true }
tokio = { workspace = true }
solana-client = "4.2.2"
solana-account-decoder = { version = "4.2.2", features = ["agave-unstable-api"] }
async-trait = "0.1.88"
serde_json = "1.0.140"
log = "0.4.27"
solana-account = { workspace = true }
bytemuck = { workspace = true }
# solana-keypair 3.1 requires five8_core's std Error implementation on host.
five8_core = { workspace = true }

[dev-dependencies]
base64 = "0.21"
solana-program-test = { workspace = true }
solana-keypair = { workspace = true }
solana-signer = { workspace = true }
solana-transaction = { workspace = true }
solana-clock = { workspace = true }
solana-instruction = { workspace = true }
solana-system-interface = { workspace = true }
solana-sdk-ids = { workspace = true }
solana-logger = { workspace = true }
spl-associated-token-account = { version = "8", features = ["no-entrypoint"] }
