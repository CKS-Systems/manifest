{
	"override_base_config": "base.conf",
	"msg": "Manifest account-backed defrag rules (eight-block whole-pass bound)",
	// The account-backed compaction model contains eight blocks. Loop
	// unwinding assertions remain enabled for all rules in this configuration.
	"loop_iter": "10",
	// Validation failures and panic paths must remain proof obligations for
	// compaction: defrag's processor does not use early_panic, so rejected
	// inputs return their ProgramError and any panic fails the rule instead
	// of pruning it. Exact bitwise semantics cover the survivor bitmap.
	"assert_on_panic": true,
	"precise_bitwise_ops": true,
	"rule": [
		// Real account-backed compaction, including rejection and repeated-pass
		// obligations. Built with the same certora feature as the other rules.
		"rule_defrag_preserves_market_bid",
		"rule_defrag_preserves_market_ask",
		"rule_defrag_zero_budget",
		"rule_defrag_repeated_passes",
		"rule_defrag_empty_market",
		"rule_defrag_sequence_overflow_rejected",
		"rule_defrag_bitmap_preserves_other_blocks",
		"rule_defrag_relocate_seat_payload",
		"rule_defrag_relocate_order_bid",
		"rule_defrag_relocate_order_ask",
		"rule_defrag_invalid_allocation_rejected",
		"rule_defrag_invalid_order_owner_rejected",
		"rule_defrag_requires_collector",
		"rule_defrag_requires_signature",
		"rule_defrag_requires_writable_collector",
		"rule_defrag_invalid_instruction_data_rejected",
	],
}
