{
   "loop_iter": "1",
   "optimistic_loop": false,
   "java_args" : ["-Dlevel.sbf=info"],
   // These optimistic memory assumptions are required for the prover's TAC
   // translation of this program: without them the backend aborts on writes
   // whose overlap set it cannot determine. rules-defrag.conf layers panic
   // obligations and exact bitwise semantics on top for the compaction rules.
   "prover_args" :[
          "-solanaOptimisticJoin true",
          "-solanaOptimisticOverlaps true",
          "-solanaOptimisticMemcpyPromotion true",
          "-solanaOptimisticMemcmp true",
          "-solanaOptimisticNoMemmove true",
          "-solanaOptimisticJoinWithStackPtr true",
          "-solanaAggressiveGlobalDetection true",
          "-solanaPrintDevMsg true",
          "-solanaTACOptimize 3",
          "-unsatCoresForAllAsserts true"
          ],
   "server": "production",
   // Batched vacuity sub-rules are unusable for gating: they starve into
   // SANITY_FAILED in multi-rule jobs, and their internally generated
   // satisfy-variant hits prover encoding errors (3006/3308) on processor
   // paths the sliced main rules never touch. The main obligations verify.
   "rule_sanity": "none",
   "cargo_tools_version": "v1.53",
   "solana_sbf_arch": "v3",
   "build_script": "../build.sh",
}
