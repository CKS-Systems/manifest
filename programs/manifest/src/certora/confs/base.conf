{
   "loop_iter": "1",
   "optimistic_loop": false,
   // Validation failures and panic paths must remain proof obligations.
   "assert_on_panic": true,
   "precise_bitwise_ops": true,
   "java_args" : ["-Dlevel.sbf=info"],
   "prover_args" :[
          // Keep exact 64-bit semantics and explicit memory behavior for every
          // rule, including compaction's bitmap and block-copy operations.
          "-solanaTACSoundSignedMath true",
          "-solanaDefactoSemantics false",
          "-solanaOptimisticNoMemmove false",
          "-solanaAggressiveGlobalDetection true",
          "-solanaPrintDevMsg true",
          "-solanaTACOptimize 3", 
          "-unsatCoresForAllAsserts true"
          ],
   "server": "production",
   "rule_sanity": "basic",
   "cargo_tools_version": "v1.53",
   "solana_sbf_arch": "v3",
   "build_script": "../build.sh",
}
